name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install QSV binary (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://github.com/dathere/qsv/releases/latest/download/qsv-latest-x86_64-unknown-linux-musl.tar.gz | tar -xz -C /usr/local/bin
          qsv --version

      - name: Install QSV binary (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install qsv
          qsv --version

      - name: Install QSV binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install qsv -y
          qsv --version

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint code
        run: pnpm run lint

      - name: Build package & assets
        run: pnpm run build

      - name: Run automated tests
        run: pnpm test
